<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ai00</title>
    <script src="https://unpkg.com/typewriter-effect@3/dist/core.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.1.2/dist/axios.min.js"></script>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>AI Afghani Poem Generator</h1>
    </header>

    <main>
      <form id="search-form">
        <input
          type="text"
          placeholder="Enter the topic of the Afghani poem"
          autofocus
          required
          autocomplete="off"
          id="ai-poem"
        />
        <input type="submit" />
      </form>
      <div id="poem" class="hidden"></div>
      <br />
    </main>

    <footer>
      This project was coded by
      <a href="https://github.com/faizahabibi778-ui" target="_blank">FAIZA</a>
      and is <a href="https://github.com" target="_blank">on GitHub</a> and
      <a href="#" target="_blank">hosted on Netlify</a>
    </footer>
    <script src="index.js"></script>
  </body>
</html>
