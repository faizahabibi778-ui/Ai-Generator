<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ai00</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>AI Afghani Poem Generator</h1>
    </header>

    <main>
      <form>
        <input
          type="text"
          placeholder="Enter the topic of the Afghani poem"
          autofocus
          required
          autocomplete="off"
        />
        <input type="submit" />
      </form>
      <div>
        Oh water, you know the way,
        <br />
        Lead me back to the spring,
      </div>
    </main>

    <footer>
      This project was coded by

      and is <a href="https://github.com" target="_blank">on GitHub</a> and

    </footer>
    <script src="index.js"></script>
  </body>
</html>
